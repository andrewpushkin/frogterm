[package]
name = "frogterm-pc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PC tools for the reTerminal frame: Google album check and device emulator"

[dependencies]
anyhow = "1"
embedded-graphics = "0.8"
frogterm-core = { path = "../core" }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
minifb = { version = "0.28", default-features = false, features = ["x11", "dlopen"] }
rand = "0.8"
ureq = "2"
u8g2-fonts = "0.9"
