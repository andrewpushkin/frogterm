# CI: formatting, clippy and unit tests on the host; the firmware built in
# the project's Docker image (the same one `make` uses), which is kept in
# GHCR under a tag made from the Dockerfile's hash and rebuilt only when the
# Dockerfile changes.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main queues (a cancelled run may be the long dev-image build); other
  # branches only need their newest push checked
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.100.0 # as in the Dockerfile

jobs:
  host:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  image:
    name: dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: ref
        name: Image tag from the Dockerfile
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/$owner/frogterm-dev:$(sha256sum Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        name: Already in GHCR?
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space (the image is ~10 GB)
        if: steps.exists.outputs.found != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build and push
        if: steps.exists.outputs.found != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for espup's GitHub API calls
        run: docker buildx build --push --secret id=github_token,env=GITHUB_TOKEN -t "${{ steps.ref.outputs.ref }}" .

  firmware:
    name: firmware build
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (the image is ~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Pull the dev image
        run: |
          docker pull "${{ needs.image.outputs.ref }}"
          docker tag "${{ needs.image.outputs.ref }}" frogterm-dev
          # tell make the image is up to date
          mkdir -p build && touch build/.image-stamp
      - uses: actions/cache@v6
        with:
          path: |
            .cargo-docker
            build/target
          key: firmware-${{ hashFiles('Dockerfile') }}-${{ hashFiles('firmware/Cargo.lock', 'firmware/sdkconfig.defaults') }}
          restore-keys: firmware-${{ hashFiles('Dockerfile') }}-
      - name: Example config (secrets stay out of CI)
        run: cp config.example.toml config.toml
      - name: Firmware fmt and clippy
        run: |
          docker run --rm --init -v "$PWD":/work -w /work -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CARGO_HOME=/work/.cargo-docker -e CARGO_TARGET_DIR=/work/build/target frogterm-dev \
            sh -c 'cd firmware && cargo fmt --check && cargo clippy --release -- -D warnings'
      - name: make firmware
        run: make firmware
      - uses: actions/upload-artifact@v7
        with:
          name: frogterm-firmware
          path: build/frogterm.bin
          if-no-files-found: error
