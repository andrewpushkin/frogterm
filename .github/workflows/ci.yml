# CI: formatting, clippy and unit tests on the host; the firmware built in
# the project's Docker image (the same one `make` uses), which is kept in
# GHCR under a tag made from the Dockerfile's hash and rebuilt only when the
# Dockerfile changes. Every push to main is a release: version = commits on
# main (tag v<N>, firmware.bin + firmware-full.bin), and the GitHub Pages
# site (site/) is deployed with it.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main queues (a cancelled run may be the long dev-image build); other
  # branches only need their newest push checked
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.100.0 # as in the Dockerfile

jobs:
  host:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  image:
    name: dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: ref
        name: Image tag from the Dockerfile
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/$owner/frogterm-dev:$(sha256sum Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        name: Already in GHCR?
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space (the image is ~10 GB)
        if: steps.exists.outputs.found != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build and push
        if: steps.exists.outputs.found != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for espup's GitHub API calls
        run: docker buildx build --push --secret id=github_token,env=GITHUB_TOKEN -t "${{ steps.ref.outputs.ref }}" .

  firmware:
    name: firmware build
    needs: image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits
      - id: version
        name: Version (commits on main; other branches dev-<commit>)
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "version=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space (the image is ~10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Pull the dev image
        run: |
          docker pull "${{ needs.image.outputs.ref }}"
          docker tag "${{ needs.image.outputs.ref }}" frogterm-dev
          # tell make the image is up to date
          mkdir -p build && touch build/.image-stamp
      - uses: actions/cache@v6
        with:
          path: |
            .cargo-docker
            build/target
          key: firmware-${{ hashFiles('Dockerfile') }}-${{ hashFiles('firmware/Cargo.lock', 'firmware/sdkconfig.defaults') }}
          restore-keys: firmware-${{ hashFiles('Dockerfile') }}-
      - name: Example config (the copy-config build checks it)
        run: cp config.example.toml config.toml
      - name: Firmware fmt and clippy
        run: |
          docker run --rm --init -v "$PWD":/work -w /work -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CARGO_HOME=/work/.cargo-docker -e CARGO_TARGET_DIR=/work/build/target frogterm-dev \
            sh -c 'cd firmware && cargo fmt --check && cargo clippy --release -- -D warnings && cargo clippy --release --all-features -- -D warnings'
      - name: make firmware
        run: make firmware FT_VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: frogterm-firmware
          path: |
            build/frogterm.bin
            build/frogterm-full.bin
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes list the commits since the last release
      - uses: actions/download-artifact@v5
        with:
          name: frogterm-firmware
          path: build
      - name: Release v${{ needs.firmware.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          cp build/frogterm.bin firmware.bin
          cp build/frogterm-full.bin firmware-full.bin
          last=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD 2>/dev/null || true)
          {
            echo "frogterm $VERSION — the firmware for the reTerminal E1002."
            echo
            echo "- \`firmware.bin\`: update — upload it on the device's settings page (Firmware), or write it at 0x10000; the device keeps its settings."
            echo "- \`firmware-full.bin\`: first install, written at 0x0; erases the settings (the device then starts in settings mode)."
            echo "- Or install from the browser: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo
            echo "Changes${last:+ since $last}:"
            echo
            git log -n 100 --no-merges --format='- %s' ${last:+$last..}HEAD
          } > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" firmware.bin firmware-full.bin --clobber
          else
            gh release create "v$VERSION" firmware.bin firmware-full.bin --target "$GITHUB_SHA" \
              --title "frogterm $VERSION" --notes-file notes.md --latest
          fi

  pages:
    name: GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [firmware, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: frogterm-firmware
          path: build
      - name: Build the site
        run: site/build.sh "${{ needs.firmware.outputs.version }}" "$GITHUB_REPOSITORY" _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
