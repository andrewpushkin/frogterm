[package]
name = "frogterm-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "reTerminal E1002 photo + weather + calendar frame firmware (ESP32-S3)"

[[bin]]
name = "frogterm"
path = "src/main.rs"
harness = false

[features]
default = []
# Show six colour bars instead of the normal update (panel bring-up).
bars = []
# An empty NVS gets ../config.toml (checked at build time) as its settings.
seed-config = []

[dependencies]
anyhow = "1"
esp-idf-svc = "0.54"
frogterm-core = { path = "../core" }
log = "0.4"

[build-dependencies]
anyhow = "1"
frogterm-core = { path = "../core" }
embuild = "0.33"

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
opt-level = "z"
debug = true
