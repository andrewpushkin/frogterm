<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frogterm settings</title>
<style>
  :root { color-scheme: light dark; --accent: #2a9d4a; }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; }
  h1 { font-size: 1.4rem; margin: 0; }
  .version { margin: .2rem 0 1rem; opacity: .7; font-size: .9rem; }
  fieldset { border: 1px solid #8884; border-radius: .5rem; margin: 0 0 1rem; padding: .5rem 1rem 1rem; }
  legend { font-weight: 600; padding: 0 .3rem; }
  label { display: block; margin-top: .7rem; font-weight: 500; }
  small { display: block; opacity: .7; font-weight: normal; }
  input, textarea { box-sizing: border-box; width: 100%; font: inherit; padding: .4rem .5rem; margin-top: .2rem;
    border: 1px solid #8888; border-radius: .3rem; background: Field; color: FieldText; }
  textarea { min-height: 5rem; font-family: ui-monospace, monospace; font-size: .85rem; }
  .row { display: flex; gap: 1rem; } .row > div { flex: 1; }
  button { font: inherit; font-weight: 600; width: 100%; padding: .8rem; border: 0; border-radius: .5rem;
    background: var(--accent); color: white; cursor: pointer; }
  .msg { padding: .7rem 1rem; border-radius: .5rem; margin: 0 0 1rem; }
  .msg:empty { display: none; }
  .ok { background: #2a9d4a22; border: 1px solid var(--accent); }
  .error { background: #d6282822; border: 1px solid #d62828; }
  .check input { width: auto; margin: 0 .4rem 0 0; }
  .firmware { margin-top: 1.5rem; } .firmware p { margin: .5rem 0; }
  .firmware button { margin-top: .8rem; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<h1>frogterm settings</h1>
<p class="version">Firmware: frogterm {{firmware_version}}</p>
<p class="msg {{message_class}}">{{message}}</p>
<form method="post" action="/save">
  <fieldset>
    <legend>Photos</legend>
    <label>Google Photos album link
      <small>Shared as "anyone with the link", e.g. https://photos.app.goo.gl/…</small>
      <input name="album_url" value="{{album_url}}" required>
    </label>
  </fieldset>

  <fieldset>
    <legend>Time zone</legend>
    <label>POSIX TZ string
      <small>Empty = Israel. Central Europe: CET-1CEST,M3.5.0,M10.5.0/3</small>
      <input name="timezone" value="{{timezone}}" placeholder="IST-2IDT,M3.4.4/26,M10.5.0">
    </label>
  </fieldset>

  <fieldset>
    <legend>Weather</legend>
    <label>City <small>Looked up by name</small>
      <input name="city" value="{{city}}" required>
    </label>
    <label>Name on the screen <small>Empty = the city</small>
      <input name="place_name" value="{{place_name}}">
    </label>
    <div class="row">
      <div><label>Latitude <small>Optional, with longitude</small>
        <input name="latitude" value="{{latitude}}" inputmode="decimal"></label></div>
      <div><label>Longitude <small>&nbsp;</small>
        <input name="longitude" value="{{longitude}}" inputmode="decimal"></label></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Calendars</legend>
    <label>iCal links, one per line
      <small>Secret links stay hidden: leave their "(unchanged)" line to keep them</small>
      <textarea name="calendars" rows="4">{{calendars}}</textarea>
    </label>
  </fieldset>

  <fieldset>
    <legend>Look</legend>
    <label>Box opacity, % <small>100 = solid white boxes, 0 = fully transparent</small>
      <input name="overlay_opacity" value="{{overlay_opacity}}" inputmode="numeric" placeholder="50">
    </label>
  </fieldset>

  <fieldset>
    <legend>Device</legend>
    <label>Wi-Fi network <small>2.4 GHz</small>
      <input name="wifi_ssid" value="{{wifi_ssid}}">
    </label>
    <label>Wi-Fi password <small>Empty = unchanged</small>
      <input name="wifi_password" type="password" value="" placeholder="{{wifi_password_hint}}" autocomplete="off">
    </label>
    <label>Update times, one per line <small>Local HH:MM; empty = 06:00, 13:30, 18:15</small>
      <textarea name="update_times" rows="3">{{update_times}}</textarea>
    </label>
    <input type="hidden" name="auto_update" value="off">
    <label class="check"><input type="checkbox" name="auto_update" value="on" {{auto_update_checked}}> Install new firmware by itself
      <small>Every sync checks for a newer frogterm release; a new one is installed and the frame restarts with it at once</small>
    </label>
    <div class="row">
      <div><label>Photos per batch <small>1–20</small>
        <input name="photo_batch" value="{{photo_batch}}" inputmode="numeric" placeholder="10"></label></div>
      <div><label>Reuse weather for, min <small>1–1080</small>
        <input name="refresh_minutes" value="{{refresh_minutes}}" inputmode="numeric" placeholder="480"></label></div>
    </div>
  </fieldset>

  <button type="submit">Save</button>
</form>

<fieldset class="firmware">
  <legend>Firmware</legend>
  <p>Running: frogterm {{firmware_version}}</p>
  <label>New firmware
    <small>firmware.bin of a release (github.com/andrewpushkin/frogterm/releases), not firmware-full.bin.
    Settings and stored photos stay.</small>
    <input type="file" id="fw" accept=".bin">
  </label>
  <button type="button" id="fw-go">Install</button>
  <p class="msg" id="fw-status"></p>
</fieldset>
<script>
// the one script of the page: sends the file as the request body, with progress
document.getElementById('fw-go').onclick = function () {
  var file = document.getElementById('fw').files[0], status = document.getElementById('fw-status');
  var say = function (cls, text) { status.className = 'msg ' + cls; status.textContent = text; };
  if (!file) { say('error', 'Choose firmware.bin first.'); return; }
  var x = new XMLHttpRequest();
  x.open('POST', '/update');
  x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.upload.onprogress = function (e) {
    if (e.lengthComputable) say('', e.loaded < e.total ? 'Uploading… ' + Math.round(100 * e.loaded / e.total) + ' %' : 'Checking and installing…');
  };
  x.onload = function () { say(x.status == 200 ? 'ok' : 'error', x.responseText); };
  x.onerror = function () { say('error', 'The upload stopped: the connection to the device was lost.'); };
  this.disabled = true;
  x.onloadend = function () { document.getElementById('fw-go').disabled = false; };
  say('', 'Uploading…');
  x.send(file);
};
</script>
</body>
</html>
