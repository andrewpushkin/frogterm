[package]
name = "frogterm-core"
version = "0.1.0"
edition = "2021"
description = "Hardware-independent logic shared by the reTerminal firmware and the PC emulator"

[dependencies]
anyhow = "1"
embedded-graphics = "0.8"
jpeg-decoder = { version = "0.3", default-features = false }
serde_json = "1"
u8g2-fonts = "0.9"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
